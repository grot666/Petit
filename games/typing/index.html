<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typing Test — Petit</title>
<link rel="stylesheet" href="../style.css">
<style>
  .wrap{max-width:680px}
  #text{background:#fff;border:1px solid var(--line);border-radius:10px;padding:1.2rem 1.4rem;text-align:left;font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:1.3rem;line-height:1.9;min-height:9.5rem;color:#b5ada2;cursor:text;overflow:hidden;height:9.6rem}
  #text .ok{color:var(--ink)} #text .bad{color:#c43c2c;background:#fbe6e1;border-radius:2px}
  #text .cur{border-left:2px solid var(--accent);margin-left:-2px;animation:blink 1s step-end infinite}
  @keyframes blink{50%{border-color:transparent}}
  #input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
  .result{margin-top:1.2rem;font-size:1rem}
  .result b{font-size:1.6rem}
</style>
</head>
<body>
<a class="back" href="../">&larr; Games</a>
<div class="wrap">
  <h1>Typing Test</h1>
  <p class="hint">Thirty seconds. The clock starts with your first key. Tap the text to type on mobile.</p>
  <div class="bar">
    <div class="stat"><small>Time</small><b id="time">30</b></div>
    <div class="stat"><small>WPM</small><b id="wpm">0</b></div>
    <div class="stat"><small>Accuracy</small><b id="acc">100%</b></div>
    <div class="stat"><small>Best WPM</small><b id="best">0</b></div>
    <button id="restart">Restart</button>
  </div>
  <div id="text"></div>
  <input id="input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div class="result" id="result"></div>
</div>
<script src="typing.js"></script>
</body>
</html>
