<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petit — Breathe · 呼吸练习</title>
<link rel="stylesheet" href="../tools.css">
<style>
.bwrap{display:flex;flex-direction:column;align-items:center}
.orb{position:relative;width:min(78vw,320px);aspect-ratio:1;display:flex;align-items:center;justify-content:center;margin:1.2rem 0 1rem}
.orb .halo{position:absolute;inset:0;border-radius:50%;border:1px dashed #cfc6b6}
.orb .ball{position:absolute;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#e6f0ea,#93b5a0);transform:scale(.4);opacity:.9;
  box-shadow:0 20px 60px -20px rgba(94,120,104,.7)}
.orb .txt{position:relative;text-align:center;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.orb .txt b{display:block;font-size:1.1rem;font-weight:600}
.orb .txt span{font-size:2.2rem;font-variant-numeric:tabular-nums;font-weight:300}
</style>
</head>
<body>
<a class="back" href="../">&larr; Tools</a>
<div class="page">
  <header class="hero">
    <p class="eyebrow">Tool V</p>
    <h1>Breathe · 呼吸练习</h1>
    <p class="sub">Follow the circle: breathe in as it grows, out as it shrinks.
      <span class="zh">跟着圆圈呼吸：变大时吸气，变小时呼气。</span>
    </p>
  </header>
  <div class="bwrap">
    <div class="seg" id="pat">
      <button type="button" data-p="box" class="on">Box 4-4-4-4 方块</button><button type="button" data-p="478">4-7-8 放松</button><button type="button" data-p="calm">Calm 5-5 平静</button>
    </div>
    <div class="orb" id="orb"><div class="halo"></div><div class="ball" id="ball"></div><div class="txt"><b id="phase">Ready 准备</b><span id="count"></span></div></div>
    <div class="toolbar" style="margin-top:0">
      <button type="button" class="accent" id="go">Start 开始</button>
      <select id="len" aria-label="Duration"><option value="60">1 min 分钟</option><option value="180" selected>3 min 分钟</option><option value="300">5 min 分钟</option><option value="0">Open-ended 不限</option></select>
    </div>
    <p class="hint" id="left"></p>
  </div>
  <p class="hint">Box breathing: in 4, hold 4, out 4, hold 4. 4-7-8: in 4, hold 7, out 8. Stop if you feel dizzy. 如有头晕请停止。</p>
</div>
<script src="breathe.js"></script>
</body>
</html>
