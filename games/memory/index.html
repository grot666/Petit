<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory — Petit</title>
<link rel="stylesheet" href="../style.css">
<style>
  #board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(92vw,420px)}
  .card{aspect-ratio:3/4;perspective:600px;cursor:pointer;background:none;border:0;padding:0}
  .inner{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
  .card.up .inner,.card.done .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:8px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .back{background:var(--ink);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 6px,transparent 6px 12px)}
  .front{background:#fff;border:1px solid var(--line);transform:rotateY(180deg);font-size:min(9vw,2.4rem)}
  .card.done .front{background:#f1ece2;opacity:.75}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
</style>
</head>
<body>
<a class="back" href="../">&larr; Games</a>
<div class="wrap">
  <h1>Memory</h1>
  <p class="hint">Flip two cards at a time and find all eight pairs.</p>
  <div class="bar">
    <div class="stat"><small>Moves</small><b id="moves">0</b></div>
    <div class="stat"><small>Time</small><b id="time">0</b></div>
    <div class="stat"><small>Fewest moves</small><b id="best">–</b></div>
    <button id="restart">Restart</button>
  </div>
  <div class="stage">
    <div id="board"></div>
    <div class="overlay" id="overlay" hidden><div id="msg"></div><button id="again">Play again</button></div>
  </div>
</div>
<script src="memory.js"></script>
</body>
</html>
