<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>15 Puzzle · 数字华容道 — Petit</title>
<link rel="stylesheet" href="../style.css">
<style>
  #board{position:relative;width:min(88vw,360px);aspect-ratio:1;background:#e3dccf;border-radius:12px;padding:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  .tile{position:absolute;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:8px;border:1px solid var(--line);
    font:600 min(8vw,1.9rem)/1 "Iowan Old Style",Palatino,Georgia,serif;color:var(--ink);cursor:pointer;transition:left .12s,top .12s;box-shadow:0 2px 0 #cfc6b6}
  .tile.ok{color:var(--accent)}
  .sizes button.on{background:var(--accent)}
</style>
</head>
<body>
<a class="back" href="../">&larr; Games</a>
<div class="wrap">
  <h1>15 Puzzle · 数字华容道</h1>
  <p class="hint">Tap a tile next to the gap to slide it. Put the numbers in order.<br>点击空格旁边的方块滑动，把数字按顺序排好。方向键也可以。</p>
  <div class="bar">
    <div class="stat"><small>Moves 步数</small><b id="mv">0</b></div>
    <div class="stat"><small>Time 用时</small><b id="tm">0</b></div>
    <div class="stat"><small>Best 最佳</small><b id="best">–</b></div>
  </div>
  <div class="bar sizes">
    <button class="ghost" data-n="3">3×3</button>
    <button class="ghost" data-n="4">4×4</button>
    <button class="ghost" data-n="5">5×5</button>
    <button id="shuffle">Shuffle 打乱</button>
  </div>
  <div class="stage">
    <div id="board"></div>
    <div class="overlay" id="overlay" hidden><div id="msg"></div><button id="again">Again 再来</button></div>
  </div>
</div>
<script src="fifteen.js"></script>
</body>
</html>
