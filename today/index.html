<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petit — 今日 Petit</title>
<link rel="stylesheet" href="today.css">
</head>
<body>
<a class="back" href="../">&larr; Petit</a>
<div class="page">
  <header class="hero">
    <p class="eyebrow">今日 Petit · Today's Petit</p>
    <h1>A small thing for today</h1>
    <p class="date" id="date-label"></p>
  </header>

  <section class="artwork" aria-label="Daily generative artwork">
    <div class="frame">
      <canvas id="art" width="900" height="900" role="img" aria-label="Today's generative artwork"></canvas>
    </div>
    <div class="meta">
      <p class="title-en" id="title-en"></p>
      <p class="title-zh" id="title-zh"></p>
      <p class="algo" id="algo-label"></p>
      <div class="actions">
        <button type="button" id="download">Download PNG</button>
      </div>
    </div>
  </section>

  <nav class="nav-day" aria-label="Day navigation">
    <a id="prev-day" href="#">&larr; Prev</a>
    <span class="today-pill" id="today-pill">Today</span>
    <a id="jump-today" href="./" hidden>Jump to today</a>
    <a id="next-day" href="#">Next &rarr;</a>
  </nav>

  <section class="challenge" aria-label="Daily challenge">
    <p class="label">Today's Challenge · 今日挑战</p>
    <h2 id="ch-en"></h2>
    <p class="zh" id="ch-zh"></p>
    <p class="desc" id="ch-tip"></p>
    <div class="row">
      <a class="btn play" id="ch-play" href="#">Play</a>
      <label class="done"><input type="checkbox" id="ch-check"> Mark done</label>
    </div>
    <div class="streak">
      <div><span class="n" id="streak-n">0</span> <span style="font-size:.78rem;color:var(--muted)">day streak</span></div>
      <p class="hint" id="streak-hint"></p>
    </div>
  </section>

  <p class="foot">Same seed, same day, same piece — for everyone. No accounts, no tracking.</p>
</div>
<script src="today.js"></script>
</body>
</html>
