<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Reaction Time · 反应测试 — Petit</title>
<link rel="stylesheet" href="../style.css">
<style>
  #pad{width:min(92vw,520px);height:min(60vh,340px);margin:0 auto;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;
    cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;color:#fff;background:#4f7c8a;transition:background .08s;padding:1rem;text-align:center}
  #pad.wait{background:#b4553c}#pad.go{background:#5e8c61}#pad.early{background:#6f665b}
  #big{font:600 clamp(2rem,9vw,3.4rem)/1.1 "Iowan Old Style",Palatino,Georgia,serif}
  #small{font-size:.95rem;opacity:.9;line-height:1.5}
  #tries{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin:1rem 0 0;min-height:1.8rem}
  #tries span{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.2rem .5rem;font-size:.8rem;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<a class="back" href="../">&larr; Games</a>
<div class="wrap">
  <h1>Reaction Time · 反应测试</h1>
  <p class="hint">When the box turns green, tap as fast as you can. Five tries, then your average.<br>方块变绿时立刻点击（或按空格）。测五次，取平均。</p>
  <div class="bar">
    <div class="stat"><small>Average 平均</small><b id="avg">–</b></div>
    <div class="stat"><small>Best avg 最佳</small><b id="best">–</b></div>
  </div>
  <div id="pad" role="button" tabindex="0"><div id="big">Tap to start</div><div id="small">点击开始</div></div>
  <div id="tries"></div>
</div>
<script src="reaction.js"></script>
</body>
</html>
