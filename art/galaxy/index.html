<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petit — Pocket Galaxy · 口袋星系</title>
<link rel="stylesheet" href="../art.css">
</head>
<body>
<a class="back" href="../">&larr; Artworks</a>
<div class="page">
  <header class="hero">
    <p class="eyebrow">Artwork IV</p>
    <h1>Pocket Galaxy · 口袋星系</h1>
    <p class="sub">Thousands of stars on a slowly turning spiral; the inner arms spin faster.
      <span class="zh">几千颗星星组成缓慢旋转的旋涡，越靠近中心转得越快。</span>
    </p>
  </header>
  <div class="stage-wrap"><canvas id="c" width="900" height="900" aria-label="Pocket Galaxy"></canvas></div>
  <div class="toolbar">
    <button type="button" id="regen">New galaxy 换一个</button>
    <label class="ctl">Arms 旋臂 <input type="range" id="arms" min="2" max="6" value="3"></label>
    <button type="button" class="ghost" id="dl">Download PNG 下载</button>
  </div>
  <p class="hint">Drag up and down to tilt the disc. 上下拖动可以倾斜星系。</p>
</div>
<script src="galaxy.js"></script>
</body>
</html>
