<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Snake — Petit</title>
<link rel="stylesheet" href="../style.css">
<style>
  canvas{display:block;width:min(92vw,420px);height:auto;aspect-ratio:1;background:#fff;border:1px solid var(--line);border-radius:10px;touch-action:none}
</style>
</head>
<body>
<a class="back" href="../">&larr; Games</a>
<div class="wrap">
  <h1>Snake</h1>
  <p class="hint">Arrow keys / WASD, or swipe. Space to pause.</p>
  <div class="bar">
    <div class="stat"><small>Score</small><b id="score">0</b></div>
    <div class="stat"><small>Best</small><b id="best">0</b></div>
    <button id="restart">Restart</button>
  </div>
  <div class="stage">
    <canvas id="board" width="420" height="420"></canvas>
    <div class="overlay" id="overlay"><div id="msg">Press any arrow or tap to start</div><button id="play">Play</button></div>
  </div>
</div>
<script src="snake.js"></script>
</body>
</html>
